name: Check site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get status endpoint
        run: |
          for i in 1 2 3 4 5; do
            echo "--- attempt $i ---"
            code=$(curl -s -m 120 -o /tmp/out.txt -w "%{http_code}" https://slendywing-guard.onrender.com/ || true)
            echo "http=$code"
            cat /tmp/out.txt || true
            echo
            if grep -q botOnline /tmp/out.txt 2>/dev/null; then break; fi
            sleep 20
          done
