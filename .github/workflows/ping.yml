name: Keep Render bot awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 120 https://slendywing-guard.onrender.com/ && break
            echo "attempt $i failed, retry in 15s"
            sleep 15
          done
